[project]
name = "fundamentos-ia-2026-2-a"
version = "0.1.0"
description = "Laboratórios da disciplina Fundamentos de Inteligência Artificial — 2026.2, Turma A — ILES/ULBRA Itumbiara"
readme = "README.md"
requires-python = ">=3.12"

# Ambiente de ML clássico. O trabalho pesado (aprendizado profundo, visão
# computacional e PLN) roda no Google Colab, que já traz GPU e TensorFlow/Keras.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "jupyterlab>=4.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv]
package = false
